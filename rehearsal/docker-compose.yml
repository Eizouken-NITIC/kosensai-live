# ローカルリハーサル環境
#
# 本番と同じ mediamtx.yml / Caddyfile / web/ を **コピーせずマウントして** 使う。
# コピーを置くと必ず本番とズレるので、ここでは参照だけにしてある。
# 起動は scripts/up.sh から（自己署名証明書の生成が要るため）。
#
# ネットワークの都合:
#   本番は mediamtx も caddy も network_mode: host。macOS の Docker Desktop では
#   host ネットワークが素直に使えないので、ここでは caddy と publisher を
#   mediamtx のネットワーク名前空間に相乗りさせている。
#   こうすると caddy から 127.0.0.1:8888 で MediaMTX に届くため、
#   本番の Caddyfile（hlsAddress が 127.0.0.1 前提）をそのまま使える。

x-passphrases: &passphrases
  # リハーサル専用の使い捨て値。本番は hosts/server/.env に別の値を入れる。
  MTX_PATHS_CH1_SRTPUBLISHPASSPHRASE: rehearsal-ch1-passphrase
  MTX_PATHS_CH2_SRTPUBLISHPASSPHRASE: rehearsal-ch2-passphrase
  MTX_PATHS_CH3_SRTPUBLISHPASSPHRASE: rehearsal-ch3-passphrase
  MTX_PATHS_CH4_SRTPUBLISHPASSPHRASE: rehearsal-ch4-passphrase

x-publisher: &publisher
  # ffmpeg 同梱タグ。arm64/amd64 どちらもネイティブで動く
  image: bluenviron/mediamtx:1.19.3-ffmpeg
  network_mode: "service:mediamtx"
  depends_on: [mediamtx]
  restart: unless-stopped
  entrypoint: ["ffmpeg"]

services:
  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    container_name: rehearsal-mediamtx
    restart: unless-stopped
    environment: *passphrases
    volumes:
      - ../hosts/server/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # 視聴は https://live.kosensai.ichinoseki.ac.jp:8443/（/etc/hosts に要追記）
      - "8443:443"
      # SRT。外から手で送り込みたいとき用（publisher は内部で完結する）
      - "8890:8890/udp"
      # プレビュー用の入口（/etc/hosts と証明書警告を回避する。preview.Caddyfile 参照）
      - "8080:8080"
    # HLS(127.0.0.1:8888) は本番同様わざと公開しない。Caddy 経由でのみ触れる。

  caddy:
    image: caddy:2.11.4-alpine
    container_name: rehearsal-caddy
    restart: unless-stopped
    network_mode: "service:mediamtx"
    depends_on: [mediamtx]
    volumes:
      - ../hosts/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - ../web:/srv/live:ro

  # http://localhost:8080/ から見られるようにするだけの入口。
  # Host ヘッダを付け替えて本番 Caddy に渡すので、/etc/hosts をいじらずに済む。
  preview:
    image: caddy:2.11.4-alpine
    container_name: rehearsal-preview
    restart: unless-stopped
    network_mode: "service:mediamtx"
    depends_on: [caddy]
    volumes:
      - ./preview.Caddyfile:/etc/caddy/Caddyfile:ro

  # --- テストパターン送出 --------------------------------------------------
  # イメージにフォントが無いので drawtext は使えない。Ch の見分けは
  # 「生成パターンそのもの」と音程でつける。hue フィルタは 1 画素ずつ
  # 処理するぶん CPU を食うので使わない（実測で 1 割ほど重かった）。
  #
  #   Ch1 testsrc    カウンタ付きの動くパターン (A 440Hz)
  #   Ch2 smptebars  静止（エンコードがほぼ無料）  (C 523Hz)
  #   Ch3 rgbtestsrc 静止                          (E 659Hz)
  #   Ch4 testsrc2   別の動くパターン              (G 784Hz)
  #
  # 既定は 640x360@15 の ultrafast。UI の確認にはこれで足りる。
  # ビットレートや画質を実測したいときだけ本番相当に上げる:
  #   REH_SIZE=1280x720 REH_FPS=30 REH_BITRATE=2500k REH_PRESET=veryfast \
  #     docker compose --profile publish up -d

  pub-ch1:
    <<: *publisher
    container_name: rehearsal-pub-ch1
    profiles: ["publish"]
    command:
      - "-hide_banner"
      - "-loglevel"
      - "warning"
      - "-re"
      - "-f"
      - "lavfi"
      - "-i"
      - "testsrc=size=${REH_SIZE:-640x360}:rate=${REH_FPS:-15}"
      - "-f"
      - "lavfi"
      - "-i"
      - "sine=frequency=440:sample_rate=48000"
      - "-c:v"
      - "libx264"
      - "-preset"
      - "${REH_PRESET:-ultrafast}"
      - "-tune"
      - "zerolatency"
      - "-b:v"
      - "${REH_BITRATE:-1200k}"
      # キーフレーム間隔を 2 秒に固定する。HLS のセグメントはキーフレームでしか
      # 切れないため、これが hlsSegmentDuration の下限になる。-g はフレーム数
      # 指定でフレームレートに依存するので、時刻で指定する形を使う。
      - "-force_key_frames"
      - "expr:gte(t,n_forced*2)"
      - "-pix_fmt"
      - "yuv420p"
      - "-c:a"
      - "aac"
      - "-b:a"
      - "64k"
      - "-ar"
      - "48000"
      - "-f"
      - "mpegts"
      - "srt://127.0.0.1:8890?streamid=publish:ch1&passphrase=rehearsal-ch1-passphrase&latency=120000"

  pub-ch2:
    <<: *publisher
    container_name: rehearsal-pub-ch2
    profiles: ["publish"]
    command:
      - "-hide_banner"
      - "-loglevel"
      - "warning"
      - "-re"
      - "-f"
      - "lavfi"
      - "-i"
      - "smptebars=size=${REH_SIZE:-640x360}:rate=${REH_FPS:-15}"
      - "-f"
      - "lavfi"
      - "-i"
      - "sine=frequency=523:sample_rate=48000"
      - "-c:v"
      - "libx264"
      - "-preset"
      - "${REH_PRESET:-ultrafast}"
      - "-tune"
      - "zerolatency"
      - "-b:v"
      - "${REH_BITRATE:-1200k}"
      # キーフレーム間隔を 2 秒に固定する。HLS のセグメントはキーフレームでしか
      # 切れないため、これが hlsSegmentDuration の下限になる。-g はフレーム数
      # 指定でフレームレートに依存するので、時刻で指定する形を使う。
      - "-force_key_frames"
      - "expr:gte(t,n_forced*2)"
      - "-pix_fmt"
      - "yuv420p"
      - "-c:a"
      - "aac"
      - "-b:a"
      - "64k"
      - "-ar"
      - "48000"
      - "-f"
      - "mpegts"
      - "srt://127.0.0.1:8890?streamid=publish:ch2&passphrase=rehearsal-ch2-passphrase&latency=120000"

  pub-ch3:
    <<: *publisher
    container_name: rehearsal-pub-ch3
    profiles: ["publish"]
    command:
      - "-hide_banner"
      - "-loglevel"
      - "warning"
      - "-re"
      - "-f"
      - "lavfi"
      - "-i"
      - "rgbtestsrc=size=${REH_SIZE:-640x360}:rate=${REH_FPS:-15}"
      - "-f"
      - "lavfi"
      - "-i"
      - "sine=frequency=659:sample_rate=48000"
      - "-c:v"
      - "libx264"
      - "-preset"
      - "${REH_PRESET:-ultrafast}"
      - "-tune"
      - "zerolatency"
      - "-b:v"
      - "${REH_BITRATE:-1200k}"
      # キーフレーム間隔を 2 秒に固定する。HLS のセグメントはキーフレームでしか
      # 切れないため、これが hlsSegmentDuration の下限になる。-g はフレーム数
      # 指定でフレームレートに依存するので、時刻で指定する形を使う。
      - "-force_key_frames"
      - "expr:gte(t,n_forced*2)"
      - "-pix_fmt"
      - "yuv420p"
      - "-c:a"
      - "aac"
      - "-b:a"
      - "64k"
      - "-ar"
      - "48000"
      - "-f"
      - "mpegts"
      - "srt://127.0.0.1:8890?streamid=publish:ch3&passphrase=rehearsal-ch3-passphrase&latency=120000"

  pub-ch4:
    <<: *publisher
    container_name: rehearsal-pub-ch4
    profiles: ["publish"]
    command:
      - "-hide_banner"
      - "-loglevel"
      - "warning"
      - "-re"
      - "-f"
      - "lavfi"
      - "-i"
      - "testsrc2=size=${REH_SIZE:-640x360}:rate=${REH_FPS:-15}"
      - "-f"
      - "lavfi"
      - "-i"
      - "sine=frequency=784:sample_rate=48000"
      - "-c:v"
      - "libx264"
      - "-preset"
      - "${REH_PRESET:-ultrafast}"
      - "-tune"
      - "zerolatency"
      - "-b:v"
      - "${REH_BITRATE:-1200k}"
      # キーフレーム間隔を 2 秒に固定する。HLS のセグメントはキーフレームでしか
      # 切れないため、これが hlsSegmentDuration の下限になる。-g はフレーム数
      # 指定でフレームレートに依存するので、時刻で指定する形を使う。
      - "-force_key_frames"
      - "expr:gte(t,n_forced*2)"
      - "-pix_fmt"
      - "yuv420p"
      - "-c:a"
      - "aac"
      - "-b:a"
      - "64k"
      - "-ar"
      - "48000"
      - "-f"
      - "mpegts"
      - "srt://127.0.0.1:8890?streamid=publish:ch4&passphrase=rehearsal-ch4-passphrase&latency=120000"
