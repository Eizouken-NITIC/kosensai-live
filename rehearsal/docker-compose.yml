      - "-loglevel"
      - "warning"
      - "-re"
      - "-f"
      - "lavfi"
      - "-i"
      - "testsrc=size=1280x720:rate=30,hue=h=210"
      - "-f"
      - "lavfi"
      - "-i"
      - "sine=frequency=659:sample_rate=48000"
      - "-c:v"
      - "libx264"
      - "-preset"
      - "veryfast"
      - "-tune"
      - "zerolatency"
      - "-b:v"
      - "2500k"
      - "-g"
      - "60"
      - "-pix_fmt"
      - "yuv420p"
      - "-c:a"
      - "aac"
      - "-b:a"
      - "128k"
      - "-ar"
      - "48000"
      - "-f"
      - "mpegts"
      - "srt://127.0.0.1:8890?streamid=publish:ch3&passphrase=rehearsal-ch3-passphrase&latency=120000"

  pub-ch4:
    <<: *publisher
    container_name: rehearsal-pub-ch4
    profiles: ["publish"]
    command:
      - "-hide_banner"
      - "-loglevel"
      - "warning"
      - "-re"
      - "-f"
      - "lavfi"
      - "-i"
      - "testsrc=size=1280x720:rate=30,hue=h=280"
      - "-f"
      - "lavfi"
      - "-i"
      - "sine=frequency=784:sample_rate=48000"
      - "-c:v"
      - "libx264"
      - "-preset"
      - "veryfast"
      - "-tune"
      - "zerolatency"
      - "-b:v"
