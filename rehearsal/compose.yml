# ローカルリハーサル環境
#
# 本番と同じ mediamtx.yml / Caddyfile / web/ を、コピーせずマウントして使用する。
# コピーを配置すると本番との差分が発生するため、参照のみとする。
#
# 2 つの Caddy と publisher は mediamtx のネットワーク名前空間へ相乗りさせている。macOS の
# Docker Desktop では host ネットワークを使用できず、かつ本番の Caddyfile は MediaMTX が
# 127.0.0.1:8888 で待ち受けている前提で書かれているためである。

x-passphrases: &passphrases
  # リハーサル専用の使い捨ての値。本番は hosts/server/.env に別の値を設定する。
  MTX_PATHS_CH1_SRTPUBLISHPASSPHRASE: rehearsal-ch1-passphrase
  MTX_PATHS_CH2_SRTPUBLISHPASSPHRASE: rehearsal-ch2-passphrase
  MTX_PATHS_CH3_SRTPUBLISHPASSPHRASE: rehearsal-ch3-passphrase
  MTX_PATHS_CH4_SRTPUBLISHPASSPHRASE: rehearsal-ch4-passphrase

# 送出の内容は containers/publisher/publish.sh にある。チャンネルごとに異なるのは名前と
# パスフレーズだけであるため、compose 側には引数のみを配置する。
#
# 既定は 640x360@15 の ultrafast である。ビットレートや画質を実測する場合のみ本番相当へ
# 引き上げる:
#   REH_SIZE=1280x720 REH_FPS=30 REH_BITRATE=2500k REH_PRESET=veryfast docker compose up -d
x-publisher: &publisher
  build: ./containers/publisher
  network_mode: "service:mediamtx"
  depends_on: [mediamtx]
  restart: unless-stopped
  environment:
    REH_SIZE: "${REH_SIZE:-}"
    REH_FPS: "${REH_FPS:-}"
    REH_BITRATE: "${REH_BITRATE:-}"
    REH_PRESET: "${REH_PRESET:-}"

services:
  # 証明書と caddy-preview の Caddyfile を生成する。2 つの Caddy はこの完了を待つ。
  init:
    build: ./containers/init
    container_name: rehearsal-init
    command: ["/repo/rehearsal/containers/init/init.sh"]
    volumes:
      - ..:/repo:ro
      - ./generated/certs:/certs
      - ./generated/caddy:/caddy

  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    container_name: rehearsal-mediamtx
    restart: unless-stopped
    environment: *passphrases
    volumes:
      - ../hosts/server/mediamtx.yml:/mediamtx.yml:ro
    ports:
      # 本番と同じホスト名で視聴する場合の入口（/etc/hosts への追記が必要）
      - "8443:443"
      # SRT。外部から手動で送信する場合に使用する（publisher は内部で完結する）
      - "8890:8890/udp"
      # プレビュー（containers/init/preview.Caddyfile を参照）
      - "8080:8080"
      - "8444:8444"
    # HLS(127.0.0.1:8888) は本番と同様に公開しない。Caddy 経由でのみアクセスする。

  # 本番の Caddyfile をそのまま動作させる。caddy-preview の転送先である。
  caddy-origin:
    image: caddy:2.11.4-alpine
    container_name: rehearsal-caddy-origin
    restart: unless-stopped
    network_mode: "service:mediamtx"
    depends_on:
      init:
        condition: service_completed_successfully
      mediamtx:
        condition: service_started
    volumes:
      - ../hosts/server/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./generated/certs:/etc/caddy/certs:ro
      - ../web:/srv/live:ro

  # Host ヘッダを本番のホスト名へ付け替えて caddy-origin へ転送する。/etc/hosts を
  # 追記せずにブラウザから開くための前段であり、リハーサル専用である。
  caddy-preview:
    image: caddy:2.11.4-alpine
    container_name: rehearsal-caddy-preview
    restart: unless-stopped
    network_mode: "service:mediamtx"
    depends_on:
      init:
        condition: service_completed_successfully
      caddy-origin:
        condition: service_started
    # 生成物はディレクトリごとマウントする。ファイル単位で指定すると、初回起動時に
    # Docker が同名のディレクトリを作成して Caddy が設定を読めなくなる。
    #
    # :8444 の証明書を発行する internal CA の鍵は /data にある。ボリュームへ置かないと
    # reload.sh の --force-recreate のたびに CA が変わり、実機で受け入れた証明書の例外が
    # 毎回無効になる。
    volumes:
      - ./generated/caddy:/etc/caddy/generated:ro
      - caddy_preview_data:/data
    command:
      ["caddy", "run", "--config", "/etc/caddy/generated/preview.Caddyfile", "--adapter", "caddyfile"]

  # --- テストパターン送出 --------------------------------------------------
  pub-ch1:
    <<: *publisher
    container_name: rehearsal-pub-ch1
    command: ["ch1", "rehearsal-ch1-passphrase"]

  pub-ch2:
    <<: *publisher
    container_name: rehearsal-pub-ch2
    command: ["ch2", "rehearsal-ch2-passphrase"]

  pub-ch3:
    <<: *publisher
    container_name: rehearsal-pub-ch3
    command: ["ch3", "rehearsal-ch3-passphrase"]

  pub-ch4:
    <<: *publisher
    container_name: rehearsal-pub-ch4
    command: ["ch4", "rehearsal-ch4-passphrase"]

volumes:
  caddy_preview_data:
