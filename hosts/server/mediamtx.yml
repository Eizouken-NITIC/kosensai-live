###############################################
# MediaMTX 設定
#
# パスフレーズと Ch（パス）はこのファイルに書かない。
# compose の env_file (.env) の
#   MTX_PATHS_CH1_SRTPUBLISHPASSPHRASE=...
# から、MediaMTX がパス ch1 を作成する。.env の Ch と config.json の channels[].id が
# 一致することは、compose の init サービス（tools/config.py check）が検証する。
#
# 本部 PC の IP もこのファイルに書かない。compose.yml が .env の HQ_IP を
# MTX_AUTHINTERNALUSERS_0_IPS へ渡し、下の publish の許可範囲を上書きする。
###############################################

###############################################
# General
###############################################
logLevel: info
logDestinations: [stdout]

###############################################
# SRT server（本部OBS からの受け口）
###############################################
srt: yes
srtAddress: :8890

###############################################
# HLS server（Caddy 経由のみ・外部に直接晒さない）
###############################################
hls: yes
hlsAddress: 127.0.0.1:8888
hlsEncryption: no                  # TLS 終端は Caddy に集約
hlsAllowOrigins: ["*"]
hlsVariant: mpegts
# OBS のキーフレーム間隔と同一にする
hlsSegmentDuration: 2s
# 巻き戻せる長さを決める。app/src/lib/player.svelte.ts の dvr 側の
# backBufferLength と同一にする（180 × 2 秒 = 6 分）
hlsSegmentCount: 180
hlsAlwaysRemux: yes

###############################################
# 使わないプロトコルは無効化する
###############################################
rtsp: no
rtmp: no
webrtc: no
moq: no
api: no
metrics: no
pprof: no
playback: no

###############################################
# 接続元の制限
#
# ここに書いた範囲は .env を設定し忘れた場合の既定値で、サーバー自身からしか送出・取得できない。
# - publish: 本部 PC からのみ。compose.yml が HQ_IP を足して上書きする。
#   127.0.0.1 は smoke-test.sh とリハーサルの publisher が使う。
# - read: Caddy からのみ。HLS の視聴者はすべて Caddy を経由するため 127.0.0.1 に見える。
#   来場者が SRT で直接取り出すことを防ぐ。hlsTrustedProxies を設定すると
#   視聴者の実 IP で判定されて HLS が止まるため、設定しない。視聴者の IP は Caddy のログに残る。
###############################################
authInternalUsers:
  - user: any
    ips: ['127.0.0.1/32', '::1/128']
    permissions:
      - action: publish
  - user: any
    ips: ['127.0.0.1/32', '::1/128']
    permissions:
      - action: read

###############################################
# Path definitions
#
# パスは .env の MTX_PATHS_<Ch>_SRTPUBLISHPASSPHRASE から作成する（冒頭を参照）。
# 送出側の streamid は publish:<パス名>
#   例) srt://<server>:8890?streamid=publish:ch1&passphrase=...&latency=120000
###############################################
