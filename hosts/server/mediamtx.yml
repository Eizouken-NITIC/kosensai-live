###############################################
# 高専祭ライブ配信 / MediaMTX 設定
#
# パスフレーズはこのファイルに書かない。
# docker-compose の env_file (.env) から
#   MTX_PATHS_CH1_SRTPUBLISHPASSPHRASE=...
# の形で注入する。
###############################################

###############################################
# General
###############################################
logLevel: info
logDestinations: [stdout]

###############################################
# SRT server（本部OBS からの受け口）
###############################################
srt: yes
srtAddress: :8890

###############################################
# HLS server（Caddy 経由のみ・外部に直接晒さない）
###############################################
hls: yes
hlsAddress: 127.0.0.1:8888
hlsEncryption: no                  # TLS 終端は Caddy に集約
# 視聴ページと HLS は同一オリジンのため実際には検査されない。Caddy 側では付与しない。
hlsAllowOrigins: ["*"]
hlsTrustedProxies: [127.0.0.1]     # 前段は Caddy
hlsVariant: mpegts
# OBS のキーフレーム間隔と同一にする。
hlsSegmentDuration: 2s
# app/src/lib/player.svelte.ts の backBufferLength と同一にする（180 × 2 秒 = 360 秒）。
# 4 チャンネル合計 18.5 Mbps で約 830 MB のメモリを占める。
hlsSegmentCount: 180
# 視聴開始までの待ち時間が 11.89 秒から 0.12 秒になる（リハーサル環境での実測）。
hlsAlwaysRemux: yes

###############################################
# 使わないプロトコルは無効化する
###############################################
rtsp: no
rtmp: no
webrtc: no
moq: no
api: no
metrics: no
pprof: no
playback: no

###############################################
# Path definitions
#
# 送出側の streamid は publish:<パス名>
#   例) srt://<server>:8890?streamid=publish:ch1&passphrase=...&latency=120000
###############################################
paths:
  # Ch1: 第一体育館（ATEM Mini Pro → 本部OBS → ここ）
  ch1:
    source: publisher

  # Ch2: 第二体育館（開催有無は未確定 / 2026-07 時点）
  ch2:
    source: publisher

  # Ch3: 屋外遊撃 iPhone（Moblin → 本部OBS → ここ）
  ch3:
    source: publisher

  # Ch4: サイネージ合成（本部OBS 生成）
  ch4:
    source: publisher

  # 'all_others' はあえて定義しない。
  # 定義するとワイルドカードとして任意のパスへの publish を許してしまうため、
  # ch1〜ch4 以外への送出は拒否させる。
