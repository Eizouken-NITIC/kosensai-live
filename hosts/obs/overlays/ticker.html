<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ticker</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .ticker {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 40px;
    display: flex;
    height: 64px;
    font-size: 28px;
    font-weight: 700;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 calc(var(--slant) + 26px) 0 48px;
    background: var(--live);
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--slant)) 100%, 0 100%);
    font-weight: 900;
    white-space: nowrap;
    z-index: 1;
  }
  .body {
    flex: 1;
    display: flex;
    align-items: center;
    margin-left: calc(var(--slant) * -1);
    padding-left: 40px;
    background: rgb(10 12 15 / 0.85);
    --dur: 70s;
  }
  .body span { padding-right: 120px; }
  .body b { color: var(--live); margin-right: 18px; font-weight: 900; }
  .clock {
    display: flex;
    align-items: center;
    padding: 0 48px;
    background: var(--surface);
    font-weight: 900;
  }
</style>
</head>
<body>
<div class="ticker in">
  <div class="head" data-a="wipe"><span class="dot"></span><span id="head"></span></div>
  <div class="body marquee" data-a="fade" style="--d: 0.2s"><div id="items"></div></div>
  <div class="clock time" data-a="fade" style="--d: 0.3s" id="clock"></div>
</div>
<script src="program.js"></script>
<script src="overlay.js"></script>
<script>
  // 第一体育館の現在の演目とお知らせを流す。演目が変わった時に中身を作り直す。
  const $ = (id) => document.getElementById(id);
  const { el } = Overlay;
  let drawn = null;
  Overlay.every(1000, () => {
    const t = Overlay.now();
    $('clock').textContent = Overlay.hhmm(t);
    const cur = Overlay.current(t);
    const nxt = Overlay.next(t);
    const key = `${cur?.start} ${nxt?.start}`;
    if (key === drawn) return;
    drawn = key;
    $('head').textContent = window.PROGRAM.venue;
    const items = [];
    if (cur && cur.kind !== 'break' && cur.kind !== 'ng') items.push(['NOW', `${cur.title}(${cur.label})`]);
    if (nxt) items.push(['NEXT', `${Overlay.hhmm(nxt.start)} ${nxt.title}`]);
    for (const n of window.PROGRAM.notices) items.push(['INFO', n]);
    const row = () => items.map(([tag, text]) => el('span', {}, el('b', { textContent: tag }), text));
    $('items').replaceChildren(...row(), ...row());
  });
</script>
</body>
</html>
