<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>split</title>
<link rel="stylesheet" href="overlay.css">
<style>
  /* 映像の枠。映像は OBS 側で 864x486 にして (80,200) と (976,200) に配置する。
     枠は映像の外側に 2px の金属の縁として描画する。 */
  .pane {
    position: absolute;
    top: 198px;
    width: 864px;
    height: 486px;
  }
  .pane.l { left: 78px; }
  .pane.r { left: 974px; }
  .pane.frame { box-sizing: content-box; }
  .label {
    position: absolute;
    top: 724px;
    width: 868px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .label.l { left: 78px; }
  .label.r { left: 974px; }
  .label .caption { font-size: 28px; }
  .label .n { font-size: 52px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 0.15em; margin-bottom: -0.15em; }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="statusbar">
  <span class="title">各会場の様子</span>
  <span class="time" id="clock"></span>
  <span class="date" id="date"></span>
</div>
<div class="pane frame l"></div>
<div class="pane frame r"></div>
<div class="label l"><div class="caption"><span class="accent" id="lVenue"></span><span class="sep"></span><span id="lKind"></span></div><div class="n" id="lName"></div></div>
<div class="label r"><div class="caption"><span class="accent" id="rVenue"></span><span class="sep"></span><span id="rKind"></span></div><div class="n" id="rName"></div></div>
<script src="overlay.js"></script>
<script>
  // 左に第一体育館、右に遊撃。映像の下にそれぞれの現在の内容を表示する。
  const $ = (id) => document.getElementById(id);
  let s = Overlay.state();
  Overlay.onState((next) => { s = next; });
  $('lVenue').textContent = window.PROGRAM.ch1.name;
  $('rVenue').textContent = window.PROGRAM.ch2.name;
  Overlay.every(1000, () => {
    const t = Overlay.now();
    $('clock').textContent = Overlay.hhmm(t);
    $('date').textContent = Overlay.date(t);
    const c1 = Overlay.current('ch1', t);
    const on1 = c1 && c1.kind !== 'ng';
    $('lKind').textContent = on1 && c1.kind !== 'break' ? c1.label : '';
    $('lName').textContent = on1 ? (c1.kind === 'break' ? '休憩中' : c1.title) : '';
    const c2 = Overlay.ch2Now(s, t);
    $('rKind').textContent = c2 ? c2.label : '';
    $('rName').textContent = c2 ? c2.title : '';
  });
</script>
</body>
</html>
