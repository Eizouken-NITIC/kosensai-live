<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>control</title>
<style>
  /* 操作パネル。OBS でこのブラウザソースを右クリックし「対話」で開いて操作する。配信には映らないため、
     画面のデザインは使用しない。テロップのブラウザソースと同じ origin になるため、
     localStorage と BroadcastChannel で状態を渡す。
     OBS のブラウザソースが既定で入れる CSS(背景の透明、余白、overflow: hidden)を、詳細度の高いセレクターで上書きする。 */
  html, body { background: #fff; overflow: auto; }
  html body { margin: 16px; font: 18px system-ui, sans-serif; color: #000; }
  fieldset { margin: 0 0 16px; }
  label { display: block; padding: 6px 0; }
</style>
</head>
<body>
<fieldset><legend>お知らせ</legend><div id="notice"></div></fieldset>
<fieldset><legend>遊撃の現在地</legend><div id="ch2Place"></div></fieldset>
<script src="overlay.js"></script>
<script>
  const { el } = Overlay;
  const P = window.PROGRAM;
  // key の選択肢 [表示, 値] をラジオボタンで出す。値の null は「選ばない」。
  function radios(key, items, value) {
    document.getElementById(key).replaceChildren(...items.map(([text, v]) =>
      el('label', {}, el('input', { type: 'radio', name: key, checked: value === v, onchange: () => Overlay.setState({ [key]: v }) }), ` ${text}`)));
  }
  Overlay.onState((s) => {
    radios('notice', [['出さない', null], ...P.notices.map((text, i) => [text, i])], s.notice ?? null);
    radios('ch2Place', [['予定どおり', null], ...P.ch2.places.map(({ title, place }, i) => [`${title}(${place})`, i])], s.ch2Place ?? null);
  });
</script>
</body>
</html>
