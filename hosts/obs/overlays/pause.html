<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>pause</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .main {
    position: absolute;
    left: var(--safe);
    right: var(--safe);
    top: 300px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 28px;
  }
  .main .caption { font-size: 30px; }
  .main .when { font-size: 132px; font-weight: 400; letter-spacing: -0.01em; }
  .main .what { font-size: var(--fs-m); color: var(--lit-2); }
  /* 遊撃の映像の下に配置する場合、上の時計と重なるためステータスバーを非表示にする。 */
  body.under .statusbar { display: none; }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="statusbar">
  <span id="title"></span>
  <span class="time" id="clock"></span>
  <span id="date"></span>
</div>
<div class="main">
  <div class="caption"><span class="accent">配信休止中</span><span class="sep"></span><span id="venue"></span></div>
  <div class="when time" id="when"></div>
  <div class="what" id="what"></div>
</div>
<script src="overlay.js"></script>
<script>
  // 映像の代わりに表示する休止画面。
  // ?ch=ch1(既定): 第一体育館の配信をしない時間に表示する。表示の切り替えは channels.lua で判定し、
  //                 このページでは再開時刻だけを表示する。
  // ?ch=ch2: 遊撃の映像の下に配置し、スマートフォンからの SRT が切れて映像が消えた時に表示される。
  const $ = (id) => document.getElementById(id);
  const ch = Overlay.params.get('ch') ?? 'ch1';
  document.body.classList.toggle('under', ch === 'ch2');
  $('title').textContent = window.PROGRAM.title;
  $('venue').textContent = window.PROGRAM[ch].name;
  Overlay.every(1000, () => {
    const t = Overlay.now();
    $('clock').textContent = Overlay.hhmm(t);
    $('date').textContent = Overlay.date(t);
    if (ch === 'ch2') {
      $('what').textContent = '中継を一時休止しています。再開までお待ちください';
      return;
    }
    const show = Overlay.nextShow(t);
    const sameDay = show && show.start.toDateString() === t.toDateString();
    $('when').textContent = show && sameDay ? Overlay.hhmm(show.start) : '';
    $('what').textContent = show && sameDay ? 'この時間は配信していません。上の時刻から再開します' : 'この時間は配信していません';
  });
</script>
</body>
</html>
