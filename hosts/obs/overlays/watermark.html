<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>watermark</title>
<link rel="stylesheet" href="overlay.css">
<style>
  /* 視聴ページにロゴがあるため、映像の上では目立たない透かしにする。
     ロゴの赤は画面の赤い線と重なるので、白の単色にして半透明にする。 */
  img {
    position: absolute;
    top: 84px;
    right: var(--safe);
    height: 22px;
    filter: brightness(0) invert(1);
    opacity: 0.35;
  }
</style>
</head>
<body>
<img src="../../../app/static/assets/logo-live.svg" alt="KOSENSAI-LIVE">
</body>
</html>
