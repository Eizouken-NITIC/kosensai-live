<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>timetable</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .big { position: absolute; right: -40px; bottom: -60px; font-size: 260px; line-height: 1; }
  .wrap { position: absolute; inset: 80px 110px; }
  header { display: flex; align-items: center; gap: 28px; margin-bottom: 44px; }
  h1 { margin: 0; font-size: 64px; font-weight: 900; }
  header .chip { font-size: 26px; }
  ol {
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(8, 88px);
    grid-template-columns: 1fr 1fr;
    gap: 12px 56px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  li {
    position: relative;
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 0 28px;
    background: rgb(20 24 29 / 0.75);
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--slant)) 100%, 0 100%);
    font-size: 36px;
    font-weight: 800;
    white-space: nowrap;
  }
  li .time { width: 96px; color: var(--fg-muted); font-weight: 700; }
  li .tag { margin-left: auto; margin-right: var(--slant); font-size: 18px; font-weight: 900; letter-spacing: 0.2em; }
  li.past { opacity: 0.38; }
  li.break { color: var(--fg-muted); font-weight: 600; background: rgb(20 24 29 / 0.4); }
  li.next .tag { color: var(--live); }
  li.now { background: linear-gradient(100deg, var(--live), var(--live-deep)); }
  li.now .time { color: #fff; }
  li .progress { position: absolute; left: 0; right: 0; bottom: 0; background: rgb(0 0 0 / 0.25); }
  li .progress i { background: #fff; }
</style>
</head>
<body>
<div class="stage-bg"></div>
<div class="big outline">TIME TABLE</div>
<div class="wrap">
  <header>
    <h1>タイムテーブル</h1>
    <span class="chip"><span class="dot"></span><span id="where"></span></span>
  </header>
  <ol id="list"></ol>
</div>
<script src="program.js"></script>
<script src="overlay.js"></script>
<script>
  // 当日の進行を表示し、進行中の項目に経過のバーを付ける。配信 NG の項目は載せない。
  // 項目の並びが変わった時(進行中の項目が変わった時)だけ入りのアニメーションを再生する。
  const DAYS = ['日', '月', '火', '水', '木', '金', '土'];
  const { el } = Overlay;
  let drawn = null;
  Overlay.every(1000, () => {
    const t = Overlay.now();
    const items = Overlay.schedule(t).filter((it) => it.kind !== 'ng');
    const cur = items.find((it) => it.start <= t && t < it.end);
    const nxt = Overlay.next(t);
    const key = `${t.toDateString()} ${cur?.start}`;
    if (key !== drawn) {
      drawn = key;
      document.getElementById('where').textContent = `${t.getMonth() + 1}/${t.getDate()}(${DAYS[t.getDay()]}) ${window.PROGRAM.venue}`;
      const list = document.getElementById('list');
      list.replaceChildren(
        ...items.map((it, i) => {
          const state = it === cur ? 'now' : it.end <= t ? 'past' : +it.start === +nxt?.start ? 'next' : '';
          const li = el('li', { className: [it.kind, state].join(' ') },
            el('span', { className: 'time', textContent: Overlay.hhmm(it.start) }),
            el('span', { textContent: it.title }),
            el('span', { className: 'tag', textContent: state === 'now' ? 'ON STAGE' : state === 'next' ? 'NEXT' : '' }),
          );
          if (state === 'now') li.append(el('div', { className: 'progress' }, el('i', { id: 'bar' })));
          // wipe は clip-path を上書きして斜めの切り口が消えるため、行は fade で入れる。
          li.dataset.a = 'fade';
          li.style.setProperty('--d', `${i * 0.04}s`);
          return li;
        }),
      );
      Overlay.replay(list);
    }
    const bar = document.getElementById('bar');
    if (bar && cur) bar.style.setProperty('--p', Overlay.progress(cur, t));
  });
</script>
</body>
</html>
