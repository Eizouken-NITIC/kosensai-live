<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>timetable</title>
<link rel="stylesheet" href="overlay.css">
<style>
  /* 2 列のリスト。行の間は内側に寄せた細線で区切る。 */
  ol {
    position: absolute;
    left: var(--safe);
    right: var(--safe);
    top: 152px;
    display: grid;
    grid-auto-flow: column;
    grid-template-rows: repeat(8, 84px);
    grid-template-columns: 1fr 1fr;
    column-gap: 64px;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  li {
    position: relative;
    display: flex;
    align-items: center;
    gap: 32px;
    padding: 0 28px;
    font-size: 32px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  li .t { width: 88px; color: var(--lit-2); }
  li .n { overflow: hidden; text-overflow: ellipsis; padding-bottom: 0.15em; margin-bottom: -0.15em; }
  li .k { margin-left: auto; font-size: 22px; color: var(--lit-2); }
  /* 終わった行は消灯にする。 */
  li.past, li.past .t { color: var(--unlit); }
  li.break .n { color: var(--lit-2); }
  /* 進行中の行は選択中の枠にし、下端に経過の区切りを出す。 */
  li.now {
    border-bottom-color: transparent;
    box-sizing: border-box;
  }
  li.now .t, li.now .k { color: var(--lit); }
  li.now { align-items: flex-start; padding-top: 18px; }
  li.now .seg { position: absolute; left: 28px; right: 28px; bottom: 12px; }
  li.next .k { color: var(--lit); }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="statusbar">
  <span class="title" id="title"></span>
  <span class="time" id="clock"></span>
  <span class="date" id="date"></span>
</div>
<ol id="list"></ol>
<div class="softkeys" id="softkeys"></div>
<script src="overlay.js"></script>
<script>
  // 当日の第一体育館の進行。進行中の行を選択中の枠にし、経過を区切りの線で出す。配信しない時間は載せない。
  const $ = (id) => document.getElementById(id);
  const { el } = Overlay;
  const SEGMENTS = 10;
  let drawn = null;

  Overlay.every(1000, () => {
    const t = Overlay.now();
    $('clock').textContent = Overlay.hhmm(t);
    $('date').textContent = Overlay.date(t);
    $('title').textContent = `タイムテーブル　${window.PROGRAM.ch1.name}`;
    const items = Overlay.schedule('ch1', t).filter((it) => it.kind !== 'ng');
    const cur = items.find((it) => it.start <= t && t < it.end);
    const nxt = Overlay.next('ch1', t);
    const key = `${t.toDateString()} ${cur?.start}`;
    if (key !== drawn) {
      drawn = key;
      $('list').replaceChildren(
        ...items.map((it, i) => {
          const state = it === cur ? 'now' : it.end <= t ? 'past' : +it.start === +nxt?.start ? 'next' : '';
          const li = el('li', { className: [it.kind, state, state === 'now' ? 'frame hot' : ''].join(' ') },
            el('span', { className: 't time', textContent: Overlay.hhmm(it.start) }),
            el('span', { className: 'n', textContent: it.title }),
            el('span', { className: 'k', textContent: state === 'now' ? '出演中' : state === 'next' ? 'つぎ' : '' }),
          );
          if (state === 'now') li.append(el('div', { className: 'seg', id: 'seg' }, ...Array.from({ length: SEGMENTS }, () => el('i'))));
          li.dataset.a = 'fade';
          li.style.setProperty('--d', `${i * 0.03}s`);
          return li;
        }),
      );
      const days = Object.keys(window.PROGRAM.events);
      $('softkeys').style.setProperty('--keys', days.length);
      $('softkeys').replaceChildren(
        ...days.map((k) => {
          const d = new Date(`${k}T00:00:00`);
          return el('span', { className: d.toDateString() === t.toDateString() ? 'on' : '', textContent: Overlay.date(d) });
        }),
        el('span'),
      );
      Overlay.replay($('list'));
    }
    const seg = $('seg');
    if (seg && cur) {
      const p = Overlay.progress(cur, t);
      [...seg.children].forEach((i, n) => i.classList.toggle('on', n < Math.ceil(p * SEGMENTS)));
    }
  });
</script>
</body>
</html>
