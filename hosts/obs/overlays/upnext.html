<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>upnext</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .main {
    position: absolute;
    left: var(--safe);
    right: var(--safe);
    top: 200px;
    display: flex;
    align-items: center;
    gap: 96px;
  }
  .meter { flex: none; width: 400px; height: 400px; }
  .info { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 32px; }
  .info .caption { font-size: 30px; }
  .info .name {
    max-width: 100%;
    font-size: 112px;
    font-weight: 400;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-bottom: 0.15em;
    margin-bottom: -0.15em;
  }
  .info .start { font-size: 44px; font-weight: 400; }
  .info .start small { margin-left: 0.5em; font-size: 26px; color: var(--lit-2); }

  /* このあとの出演。タイムテーブルと同じ行の形で縦に並べ、日付の列の上まで使う。 */
  .later { position: absolute; left: var(--safe); top: 600px; font-size: 26px; color: var(--lit-2); }
  ol.after {
    position: absolute;
    left: var(--safe);
    right: var(--safe);
    top: 650px;
    display: grid;
    grid-template-rows: repeat(3, 96px);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  ol.after li {
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 0 28px;
    font-size: 40px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  ol.after .t { width: 120px; color: var(--lit-2); }
  ol.after .n { overflow: hidden; text-overflow: ellipsis; padding-bottom: 0.15em; margin-bottom: -0.15em; }
  ol.after .k { margin-left: auto; font-size: 26px; color: var(--lit-2); }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="statusbar">
  <span class="title" id="title"></span>
  <span class="time" id="clock"></span>
  <span class="date" id="date"></span>
</div>
<div id="root">
  <div class="main">
    <div class="meter" id="meter" data-a="fade"></div>
    <div class="info">
      <div class="caption" data-a="rise"><span class="accent">NEXT</span><span class="sep"></span><span id="venue"></span><span class="sep"></span><span id="kind"></span></div>
      <div class="name" data-a="rise" style="--d: 0.08s" id="name"></div>
      <div class="start time" data-a="rise" style="--d: 0.16s"><span id="start"></span><small>開始</small></div>
    </div>
  </div>
  <div class="later" data-a="rise" style="--d: 0.2s">このあと</div>
  <ol class="after" id="after"></ol>
</div>
<div class="softkeys" id="softkeys"></div>
<script src="program.js"></script>
<script src="overlay.js"></script>
<script>
  // 第一体育館の次の出演を大きく出し、開始までの残り時間を計器に出す。下にその後の 3 組を並べる。
  const $ = (id) => document.getElementById(id);
  const { el } = Overlay;
  const meter = Overlay.gauge($('meter'), { max: 30 });
  $('title').textContent = window.PROGRAM.title;
  let shown = null;

  Overlay.every(1000, () => {
    const t = Overlay.now();
    $('clock').textContent = Overlay.hhmm(t);
    $('date').textContent = Overlay.date(t);
    const nxt = Overlay.next('ch1', t);
    if (!nxt) return;
    const minutes = Math.max(0, Math.ceil((nxt.start - t) / 60000));
    meter(minutes, String(Math.min(minutes, 99)), '分');
    if (shown === `${nxt.start}`) return;
    shown = `${nxt.start}`;
    $('venue').textContent = window.PROGRAM.ch1.name;
    $('kind').textContent = nxt.label;
    $('name').textContent = nxt.title;
    $('start').textContent = Overlay.hhmm(nxt.start);
    // このあとの出演を 3 組、行の形で並べる。
    const later = Overlay.schedule('ch1', t)
      .filter((it) => it.start > nxt.start && (it.kind === 'band' || it.kind === 'dance'))
      .slice(0, 3);
    $('after').replaceChildren(
      ...later.map((it, i) =>
        el('li', { style: `--d: ${0.24 + i * 0.06}s` },
          el('span', { className: 't time', textContent: Overlay.hhmm(it.start) }),
          el('span', { className: 'n', textContent: it.title }),
          el('span', { className: 'k', textContent: it.label }),
        ),
      ),
    );
    for (const d of $('after').children) d.dataset.a = 'rise';
    // 下部の列。日付ごとの見出しで、当日を点灯する。
    const days = Object.keys(window.PROGRAM.events);
    $('softkeys').style.setProperty('--keys', days.length);
    $('softkeys').replaceChildren(
      ...days.map((key) => {
        const d = new Date(`${key}T00:00:00`);
        return el('span', { className: d.toDateString() === t.toDateString() ? 'on' : '', textContent: Overlay.date(d) });
      }),
      el('span'),
    );
    Overlay.replay($('root'));
  });
</script>
</body>
</html>
