<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>upnext</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .big { position: absolute; top: 40px; left: -20px; font-size: 320px; line-height: 1; }
  .card {
    position: absolute;
    left: 140px;
    right: 140px;
    top: 330px;
  }
  .card .chip { font-size: 30px; }
  .name {
    margin-top: 26px;
    font-size: 150px;
    font-weight: 900;
    line-height: 1.1;
    white-space: nowrap;
  }
  .rule { width: 520px; height: 8px; margin-top: 30px; background: var(--live); transform-origin: left; }
  .when {
    display: flex;
    align-items: baseline;
    gap: 30px;
    margin-top: 28px;
    font-size: 44px;
    font-weight: 800;
  }
  .when .remain { color: var(--fg-muted); font-size: 34px; }
  .after {
    position: absolute;
    right: 140px;
    bottom: 110px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    font-size: 30px;
    font-weight: 700;
  }
  .after .time { color: var(--fg-muted); margin-right: 16px; }
  .in [data-a='bar'] { transform-origin: left; }
  @keyframes bar { from { transform: scaleX(0); } to { transform: none; } }
</style>
</head>
<body>
<div class="stage-bg"></div>
<div class="big outline">UP NEXT</div>
<div id="root">
  <div class="card">
    <span class="chip" data-a="wipe"><span class="dot"></span><span id="venue"></span><small id="kind"></small></span>
    <div class="mask"><div class="name" data-a="rise" style="--d: 0.2s" id="name"></div></div>
    <div class="rule" data-a="bar" style="--d: 0.45s"></div>
    <div class="when" data-a="fade" style="--d: 0.55s"><span class="time" id="start"></span><span class="remain" id="remain"></span></div>
  </div>
  <div class="after" id="after"></div>
</div>
<script src="program.js"></script>
<script src="overlay.js"></script>
<script>
  // 次の演目を大きく見せる。その後に続く 2 組も右下に出す。
  const $ = (id) => document.getElementById(id);
  const { el } = Overlay;
  let shown = null;
  Overlay.every(1000, () => {
    const t = Overlay.now();
    const nxt = Overlay.next(t);
    if (!nxt) return;
    $('remain').textContent = Overlay.remain(nxt.start, t);
    if (shown === `${nxt.start}`) return;
    shown = `${nxt.start}`;
    $('venue').textContent = window.PROGRAM.venue;
    $('kind').textContent = nxt.label;
    $('name').textContent = nxt.title;
    $('start').textContent = `${Overlay.hhmm(nxt.start)} START`;
    const later = Overlay.schedule(t).filter((it) => it.start > nxt.start && it.kind !== 'break' && it.kind !== 'ng').slice(0, 2);
    $('after').replaceChildren(
      ...(later.length ? [el('span', { className: 'kicker', textContent: 'AND THEN' })] : []),
      ...later.map((it, i) => el('div', { style: `--d: ${0.7 + i * 0.1}s` }, el('span', { className: 'time', textContent: Overlay.hhmm(it.start) }), it.title)),
    );
    for (const d of $('after').children) d.dataset.a = 'fade';
    Overlay.replay($('root'));
  });
</script>
</body>
</html>
