<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>standby</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .big {
    position: absolute;
    top: 120px;
    left: 0;
    right: 0;
    font-size: 300px;
    line-height: 1;
    --dur: 60s;
  }
  main {
    position: absolute;
    inset: 0 0 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  main img { height: 92px; }
  .msg { font-size: 54px; font-weight: 900; }
  .count {
    display: flex;
    align-items: baseline;
    gap: 22px;
    font-size: 30px;
    font-weight: 700;
    color: var(--fg-muted);
  }
  .count b {
    font-size: 96px;
    font-weight: 900;
    color: var(--fg);
    letter-spacing: 0.02em;
  }
  .lineup {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 180px;
    padding: 14px 0;
    border-block: 1px solid var(--line);
    background: rgb(10 12 15 / 0.6);
    font-size: 30px;
    font-weight: 700;
    --dur: 50s;
  }
  .lineup span { padding: 0 28px; }
  .lineup .kicker { font-size: 22px; padding-right: 0; }
  footer {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .invite { display: flex; align-items: center; gap: 24px; font-size: 26px; font-weight: 800; }
  .invite img { width: 110px; height: 110px; padding: 8px; border-radius: 6px; background: #fff; }
  .invite small { display: block; margin-top: 4px; font-size: 20px; font-weight: 500; color: var(--fg-muted); }
  .clock { font-size: 56px; font-weight: 900; }
</style>
</head>
<body>
<div class="stage-bg"></div>
<div class="big outline marquee"><div><span>KOSENSAI LIVE&nbsp;</span><span>KOSENSAI LIVE&nbsp;</span></div></div>
<main class="in">
  <img src="../../../app/static/assets/logo-live.svg" alt="KOSENSAI-LIVE" data-a="fade">
  <div class="msg" data-a="fade" style="--d: 0.15s" id="msg"></div>
  <div class="count" data-a="fade" style="--d: 0.3s" id="count"></div>
</main>
<div class="lineup marquee" id="lineup" hidden><div id="lineupInner"></div></div>
<footer>
  <div class="invite">
    <img src="../../../app/static/assets/qr-viewer.svg" alt="">
    <div>スマホからも視聴できます<small>live.kosensai.ichinoseki.ac.jp ・ 学内 Wi-Fi 限定</small></div>
  </div>
  <div class="clock time" id="clock"></div>
</footer>
<script src="program.js"></script>
<script src="overlay.js"></script>
<script>
  // 開始前は開始までのカウントダウン、休憩中は再開の時刻、終了後はお礼を表示する。
  // 下の帯には次の配信日の出演者を流す。
  const $ = (id) => document.getElementById(id);
  const DAYS = ['日', '月', '火', '水', '木', '金', '土'];
  const pad = (n) => String(n).padStart(2, '0');
  const countdown = (to, t) => {
    const s = Math.max(0, Math.floor((to - t) / 1000));
    const h = Math.floor(s / 3600);
    return h ? `${h}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}` : `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  };
  let lineupDay = null;
  Overlay.every(1000, () => {
    const t = Overlay.now();
    const cur = Overlay.current(t);
    const start = Overlay.nextStart(t);
    $('clock').textContent = Overlay.hhmm(t);
    if (cur && cur.kind === 'break') {
      $('msg').textContent = 'ただいま休憩中です';
      $('count').innerHTML = `再開まで <b class="time">${countdown(cur.end, t)}</b> ${Overlay.hhmm(cur.end)} 再開`;
    } else if (start) {
      const today = start.toDateString() === t.toDateString();
      const when = today ? Overlay.hhmm(start) : `${start.getMonth() + 1}/${start.getDate()}(${DAYS[start.getDay()]}) ${Overlay.hhmm(start)}`;
      $('msg').textContent = 'まもなく配信を開始します';
      $('count').innerHTML = today
        ? `配信開始まで <b class="time">${countdown(start, t)}</b> ${when} 開始`
        : `次の配信 <b class="time">${when}</b>`;
    } else {
      $('msg').textContent = 'ご視聴ありがとうございました';
      $('count').textContent = '本日の配信は終了しました';
    }
    const day = (cur && cur.kind === 'break') ? t : start;
    const key = day && day.toDateString();
    if (key !== lineupDay) {
      lineupDay = key;
      const names = day ? Overlay.schedule(day).filter((it) => it.kind === 'band' || it.kind === 'dance') : [];
      $('lineup').hidden = !names.length;
      const span = (text, className = '') => Object.assign(document.createElement('span'), { textContent: text, className });
      const row = () => [span("TODAY'S LINE UP", 'kicker'), ...names.map((it) => span(it.title))];
      $('lineupInner').replaceChildren(...row(), ...row());
    }
  });
</script>
</body>
</html>
