<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>standby</title>
<link rel="stylesheet" href="overlay.css">
<style>
  /* 中央: 左に計器、右に状態と時刻。 */
  .main {
    position: absolute;
    left: 0;
    right: 0;
    top: 168px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 96px;
  }
  .meter { width: 380px; height: 380px; }
  .info { display: flex; flex-direction: column; align-items: flex-start; gap: 28px; }
  .info .caption { font-size: 30px; }
  .info .when { font-size: 132px; font-weight: 400; letter-spacing: -0.01em; }
  .info .what { font-size: var(--fs-m); color: var(--lit-2); }
  .info .invite { font-size: var(--fs-s); color: var(--lit-2); }

  .lineup { top: 648px; }
  .pager { position: absolute; left: 720px; right: 720px; top: 828px; }

</style>
</head>
<body>
<div class="backdrop"></div>
<div class="statusbar">
  <span class="title" id="title"></span>
  <span class="time" id="clock"></span>
  <span class="date" id="date"></span>
</div>
<div class="main in">
  <div class="meter" id="meter" data-a="fade"></div>
  <div class="info">
    <div class="caption" data-a="rise"><span class="accent" id="state"></span><span class="sep"></span><span id="venue"></span></div>
    <div class="when time" data-a="rise" style="--d: 0.08s" id="when"></div>
    <div class="what" data-a="rise" style="--d: 0.16s" id="what"></div>
    <div class="invite" data-a="rise" style="--d: 0.24s">スマホからも視聴できます　live.kosensai.ichinoseki.ac.jp</div>
  </div>
</div>
<div class="lineup" id="lineup"></div>
<div class="seg pager" id="pager"></div>
<div class="softkeys" id="softkeys"></div>
<script src="program.js"></script>
<script src="overlay.js"></script>
<script>
  // 開始前は開始までの残り時間を計器に出す。休憩中は再開まで、終了後はお礼を出す。
  // 下には、その日の第一体育館の出演を局のタイルの形で並べ、次の出演を選択中の形にする。
  const $ = (id) => document.getElementById(id);
  const { el } = Overlay;
  const meter = Overlay.gauge($('meter'), { max: 60 });
  const PER_PAGE = 6;
  $('title').textContent = window.PROGRAM.title;

  Overlay.every(1000, () => {
    const t = Overlay.now();
    $('clock').textContent = Overlay.hhmm(t);
    $('date').textContent = Overlay.date(t);
    const cur = Overlay.current('ch1', t);
    const start = Overlay.nextStart(t);
    const resume = cur && cur.kind === 'break' ? cur.end : null;
    const target = resume ?? start;
    const sameDay = target && target.toDateString() === t.toDateString();
    const minutes = target ? Math.max(0, Math.ceil((target - t) / 60000)) : 0;

    if (resume) {
      $('state').textContent = '休憩中';
      $('what').textContent = '第一体育館の配信は、まもなく再開します';
    } else if (start) {
      $('state').textContent = sameDay ? '配信開始まで' : '次の配信';
      $('what').textContent = sameDay ? 'まもなく配信を開始します' : Overlay.date(start);
    } else {
      $('state').textContent = '本日の配信は終了しました';
      $('what').textContent = 'ご視聴ありがとうございました';
    }
    $('venue').textContent = window.PROGRAM.ch1.name;
    $('when').textContent = target ? Overlay.hhmm(target) : '';
    meter(sameDay ? minutes : 0, sameDay ? String(Math.min(minutes, 99)) : '--', '分');

    // 出演の並び。次の出演を含むページを出す。
    const day = target ?? t;
    const acts = Overlay.schedule('ch1', day).filter((it) => it.kind === 'band' || it.kind === 'dance');
    const nextIdx = Math.max(0, acts.findIndex((it) => it.start >= (resume ?? t)));
    const page = Math.floor(nextIdx / PER_PAGE);
    const pages = Math.max(1, Math.ceil(acts.length / PER_PAGE));
    $('lineup').replaceChildren(
      ...acts.slice(page * PER_PAGE, page * PER_PAGE + PER_PAGE).map((it, i) =>
        el('div', { className: `frame${page * PER_PAGE + i === nextIdx ? ' hot' : ''}` },
          el('span', { className: 't time', textContent: Overlay.hhmm(it.start) }),
          el('span', { className: 'n', textContent: it.title }),
        ),
      ),
    );
    $('pager').replaceChildren(...Array.from({ length: pages }, (_, i) => el('i', { className: i === page ? 'on' : '' })));

    // 下部の列。日付ごとの見出しと、視聴の案内。
    const days = Object.keys(window.PROGRAM.events);
    $('softkeys').style.setProperty('--keys', days.length);
    $('softkeys').replaceChildren(
      ...days.map((key) => {
        const d = new Date(`${key}T00:00:00`);
        return el('span', { className: d.toDateString() === day.toDateString() ? 'on' : '', textContent: Overlay.date(d) });
      }),
      el('span'),
    );
  });
</script>
</body>
</html>
