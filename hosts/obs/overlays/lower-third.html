<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>lower-third</title>
<link rel="stylesheet" href="overlay.css">
<style>
  .lt {
    position: absolute;
    left: 80px;
    bottom: 80px;
    display: grid;
    grid-template-columns: auto auto;
    align-items: end;
    gap: 0 0;
  }
  .lt:not(.in) { visibility: hidden; }
  .lt.out { visibility: visible; }

  .stage { grid-column: 1 / -1; justify-self: start; margin-bottom: 10px; }

  .plate {
    position: relative;
    min-width: 640px;
    padding: 18px calc(var(--slant) * 2 + 40px) 0 44px;
    background: linear-gradient(100deg, rgb(10 12 15 / 0.92) 60%, rgb(20 24 29 / 0.85));
    clip-path: polygon(0 0, 100% 0, calc(100% - var(--slant) * 2) 100%, 0 100%);
  }
  .plate .bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 10px;
    background: var(--live);
  }
  .plate .title {
    margin-top: 2px;
    font-size: 72px;
    font-weight: 900;
    line-height: 1.12;
    white-space: nowrap;
  }
  .plate .foot {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 10px 0 0;
    padding-bottom: 16px;
    font-size: 22px;
    font-weight: 700;
    color: var(--fg-muted);
  }
  .plate .progress { width: 260px; }

  .next {
    margin-left: -26px;
    margin-bottom: 0;
    padding: 14px calc(var(--slant) + 30px) 16px 44px;
    background: var(--surface);
    clip-path: polygon(var(--slant) 0, 100% 0, calc(100% - var(--slant)) 100%, 0 100%);
    font-size: 30px;
    font-weight: 800;
    white-space: nowrap;
  }
  .next .kicker { display: block; margin-bottom: 2px; font-size: 18px; }
  .next .time { color: var(--fg-muted); margin-right: 14px; }
</style>
</head>
<body>
<div class="lt" id="lt">
  <div class="stage chip" data-a="wipe"><span class="dot"></span><span id="venue"></span><small id="kind"></small></div>
  <div class="plate" data-a="wipe" style="--d: 0.12s">
    <div class="bar" data-a="bar" style="--d: 0.1s"></div>
    <div class="kicker" data-a="fade" style="--d: 0.3s" id="kicker"></div>
    <div class="mask"><div class="title" data-a="rise" style="--d: 0.38s" id="title"></div></div>
    <div class="foot" data-a="fade" style="--d: 0.55s">
      <span class="time" id="span"></span>
      <div class="progress"><i id="bar"></i></div>
    </div>
  </div>
  <div class="next" data-a="wipe" style="--d: 0.7s" id="next">
    <span class="kicker">NEXT</span>
    <span class="time" id="nextTime"></span><span id="nextTitle"></span>
  </div>
</div>
<script src="program.js"></script>
<script src="overlay.js"></script>
<script>
  // 第一体育館の現在の演目と次の演目。演目が変わるたびに入りのアニメーションを再生し、
  // 演目の無い時間と配信 NG の時間は隠す。
  const $ = (id) => document.getElementById(id);
  const lt = $('lt');
  let shown = null;
  Overlay.every(1000, () => {
    const t = Overlay.now();
    const cur = Overlay.current(t);
    const key = cur && cur.kind !== 'ng' ? `${cur.start}` : null;
    if (key !== shown) {
      shown = key;
      if (!key) {
        lt.classList.replace('in', 'out');
        return;
      }
      const nxt = Overlay.next(t);
      const rest = cur.kind === 'break';
      $('venue').textContent = window.PROGRAM.venue;
      $('kind').textContent = cur.label;
      $('kicker').textContent = rest ? 'BREAK' : 'NOW ON STAGE';
      $('title').textContent = rest ? `${Overlay.hhmm(cur.end)} から再開します` : cur.title;
      $('span').textContent = `${Overlay.hhmm(cur.start)} – ${Overlay.hhmm(cur.end)}`;
      $('next').hidden = !nxt;
      if (nxt) {
        $('nextTime').textContent = Overlay.hhmm(nxt.start);
        $('nextTitle').textContent = nxt.title;
      }
      Overlay.replay(lt);
    }
    if (cur) $('bar').style.setProperty('--p', Overlay.progress(cur, t));
  });
</script>
</body>
</html>
