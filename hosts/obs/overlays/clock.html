<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>clock</title>
<link rel="stylesheet" href="overlay.css">
<style>
  /* Ch3 の左上の時計。 */
  .clock {
    position: absolute;
    left: var(--safe);
    top: 72px;
    padding: 14px 32px 16px;
    gap: 24px;
  }
  .clock .hm { font-size: 56px; font-weight: 400; }
  .clock .day { font-size: var(--fs-s); color: var(--lit-2); }
</style>
</head>
<body>
<div class="tile across clock">
  <span class="hm time" id="hm"></span><span class="sep"></span><span class="day" id="day"></span>
</div>
<script src="overlay.js"></script>
<script>
  Overlay.every(1000, () => {
    const t = Overlay.now();
    document.getElementById('hm').textContent = Overlay.hhmm(t);
    document.getElementById('day').textContent = Overlay.date(t);
  });
</script>
</body>
</html>
