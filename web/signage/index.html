<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>高専祭サイネージ</title>
<link rel="icon" href="data:,">
<!-- 見た目は assets/theme.css（暫定・HP 部門とすり合わせる）と
     assets/signage.css（レイアウト）に分離してある。ここには style を書かない。
     右カラムの幅は signage.css の --side（既定 26vw）。 -->
<link rel="stylesheet" href="/assets/theme.css">
<link rel="stylesheet" href="/assets/signage.css">
<!--
  校内サイネージ端末（Raspberry Pi 等）用の全画面ページ。起動方法は
  hosts/signage/README.md を参照。
-->
</head>
<body>

<div class="signage">
  <div class="signage-stage">
    <div class="signage-live" id="live"><i></i>LIVE</div>
    <video id="video" playsinline muted autoplay preload="none"></video>
    <div class="signage-idle is-shown" id="idle">
      <div class="signage-spinner"></div>
      <h1>高専祭ライブ配信</h1>
      <p id="idleMsg">まもなく放送を開始します</p>
    </div>
  </div>

  <aside class="signage-side">
    <div class="signage-side-head">
      <span class="label" id="hpLabel">本日の予定・お知らせ</span>
      <span class="clock" id="clock">--:--</span>
    </div>
    <!-- URL は config.json の officialSite.embedUrl。
         allow-scripts を外すと公式サイトの中身が透明のまま出ないので必ず残す。 -->
    <iframe id="hpFrame"
            title="高専祭公式サイト"
            referrerpolicy="no-referrer"
            sandbox="allow-scripts allow-same-origin"></iframe>
    <div class="signage-side-foot">
      live.kosensai.ichinoseki.ac.jp<br>スマホでも視聴できます（学内Wi-Fi限定）
    </div>
  </aside>
</div>

<script src="/vendor/hls.min.js"></script>
<script src="/assets/player.js"></script>
<script>
(function () {
  'use strict';

  var CH = new URLSearchParams(location.search).get('ch') || 'ch4';

  var IFRAME_RELOAD_MS = 5 * 60 * 1000;      // 公式サイト側の更新を拾う
  var PAGE_RELOAD_MS   = 6 * 60 * 60 * 1000; // 長時間運転のリーク対策（無人運用の保険）

  var video = document.getElementById('video');
  var idle  = document.getElementById('idle');
  var live  = document.getElementById('live');
  var msg   = document.getElementById('idleMsg');

  var player = window.KosensaiPlayer.create(video, function (state, detail) {
    if (state === 'playing') {
      idle.classList.remove('is-shown');
      live.classList.add('is-shown');
      return;
    }
    idle.classList.add('is-shown');
    live.classList.remove('is-shown');

    if (state === 'blocked') {
      // Kiosk では誰も触らないので、自動再生を許可した状態で起動すること
      // （--autoplay-policy=no-user-gesture-required）。
      msg.textContent = '再生を開始できません（自動再生がブロックされています）';
      detail.resume();
    } else if (state === 'unsupported') {
      msg.textContent = 'このブラウザは再生に対応していません';
    } else {
      msg.textContent = 'まもなく放送を開始します';
    }
  });

  player.load(CH);

  // 公式サイトの埋め込み先は config.json から取る
  window.KosensaiPlayer.loadConfig().then(function (cfg) {
    var site = cfg.officialSite || {};
    if (site.label) { document.getElementById('hpLabel').textContent = site.label; }
    document.getElementById('hpFrame').src =
      site.embedUrl || 'https://kosensai.ichinoseki.ac.jp/';
  });

  // 時計（端末の NTP が合っていることを確認しておくこと）
  function tick() {
    var d = new Date();
    document.getElementById('clock').textContent =
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 15000);

  // 公式サイト側の更新を定期的に取り直す
  setInterval(function () {
    var f = document.getElementById('hpFrame');
    f.src = f.src;
  }, IFRAME_RELOAD_MS);

  // 無人運用の保険。再生中はリロードしない。
  setInterval(function () {
    if (video.paused || video.readyState < 3) { location.reload(); }
  }, PAGE_RELOAD_MS);
})();
</script>
</body>
</html>
