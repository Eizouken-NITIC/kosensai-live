# 本部 PC と開発用の PC で実行する CLI(tools/kosensai_live/)。uv run kosensai-live で実行する。
[project]
name = "kosensai-live"
version = "0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "obsws-python==1.8.0",
  "segno==1.6.6",
  "pyatem",
  # pyatem の transport が無条件に import する(ATEM の USB 接続は使用しない)
  "pyusb==1.3.1",
]

# PyPI の pyatem(0.10.0)は 2024-03 で止まっているため、git のコミットを指定する。
# 上流(https://git.sr.ht/~martijnbraam/pyatem)の bbded93 は画像の変換の C 拡張をビルドするため、
# C 拡張を外したフォークの pure-python ブランチを使用し、本部 PC に C コンパイラを不要にする。
[tool.uv.sources]
pyatem = { git = "https://github.com/Eizouken-NITIC/pyatem", rev = "5732116c6e9f69af43b3584a7154380013ecb3a1" }

[project.scripts]
kosensai-live = "kosensai_live.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/kosensai_live"]
